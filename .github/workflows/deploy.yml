name: Deploy

on:
  push:
    branches:
      - main
      - 'ci/**'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          test -f dist/index.html || { echo "dist/index.html fehlt"; exit 1; }
          echo "Groesse: $(du -sh dist | cut -f1)"
          ls -la dist

      - name: Upload dist via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Nur Pushes auf main laden wirklich hoch. Jeder ci/**-Branch
          # baut, verbindet sich und protokolliert, ohne etwas zu aendern.
          dry-run: ${{ github.ref_name != 'main' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.well-known/**
            **/.htaccess
